# 硅谷甄选 - 前端站点配置
# 这个文件会被前端镜像拷到 /etc/nginx/conf.d/default.conf
# 它干两件事：1) 把 dist 里的静态文件发出去  2) 把 /api/xxx 转发给后端

server {
    listen       80;
    server_name  _;                 # 有域名后改成 your-domain.com

    # 前端构建产物所在目录（Dockerfile 里拷进去的位置）
    root   /usr/share/nginx/html;
    index  index.html;

    # 不暴露 nginx 版本号
    server_tokens off;

    # 上传品牌 logo 之类会走这里，别让 nginx 把它挡了
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 接口反向代理（关键） ----------
    # 浏览器请求 /api/admin/acl/index/login
    # 这里转发成 http://backend:10086/admin/acl/index/login
    # 注意 proxy_pass 结尾这个斜杠：它负责把 /api 前缀"吃掉"
    # （后端路由本身没有 /api 前缀，所以必须去掉）
    # backend 是 docker-compose 里的服务名，由 Docker 内置 DNS 解析
    location /api/ {
        proxy_pass         http://backend:10086/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 静态资源缓存 ----------
    # Vite 打出来的文件名带 hash（index-BI8wab-g.js），内容变了文件名就变，可以放心长缓存
    location /assets/ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html 绝对不能缓存：否则发新版后用户还在用旧页面
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端用的是 hash 路由（地址长这样 /#/product/spu），
    # 所以理论上不需要 history 回退；下面这行写了也不影响，以后要换成 history 模式直接就能用
    location / {
        try_files $uri $uri/ /index.html;
    }

}

